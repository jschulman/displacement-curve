name: Weekly Data Collection (Jobs + Regulatory + Apprenticeship + Composite)

on:
  schedule:
    - cron: '0 12 * * 1'  # Every Monday at noon UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run integrity tests
        run: python -m unittest discover -s tests
      - name: Collect job postings data (BLS JOLTS)
        run: python collectors/job_postings.py --api-key "$BLS_API_KEY"
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      - name: Collect regulatory guidance data
        run: python collectors/regulatory_tracker.py
      - name: Collect apprenticeship youth-share (Census ACS)
        run: python collectors/youth_share.py --years 2015-$(date -u +%Y)
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      - name: Validate signal health (fails the run if a scored signal is dead)
        run: python normalizers/validate.py
      - name: Recompute composite displacement index
        run: python normalizers/composite_index.py
      - name: Compute Apprenticeship Inflection Distance
        run: python normalizers/inflection_distance.py
      - name: Copy processed data to docs
        run: |
          mkdir -p docs/data/jobs/processed
          cp data/jobs/processed/*.json docs/data/jobs/processed/
          mkdir -p docs/data/regulatory/processed
          cp data/regulatory/processed/*.json docs/data/regulatory/processed/
          mkdir -p docs/data/composite
          cp data/composite/*.json docs/data/composite/ 2>/dev/null || true
          mkdir -p docs/data/apprenticeship/processed
          cp data/apprenticeship/processed/*.json docs/data/apprenticeship/processed/
      - name: Set up Node (for static chart render)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Render static index chart (social/OG preview + no-JS fallback)
        run: |
          npm --prefix tools install --no-audit --no-fund
          node tools/render_chart.mjs data/composite/displacement_index.json docs/displacement-index.png
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/ docs/displacement-index.png
          git diff --staged --quiet || git commit -m "chore: weekly data collection $(date -u +%Y-%m-%d)"
          git push
